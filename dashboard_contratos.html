<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Contratos com Fornecedores</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a18; font-size: 14px; }

/* topbar */
.topbar { background: #fff; border-bottom: 0.5px solid #e0e0d8; padding: 12px 28px; display: flex; align-items: center; gap: 12px; }
.topbar h1 { font-size: 17px; font-weight: 500; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.topbar-date { font-size: 12px; color: #aaa; }
.btn-drive { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 8px; border: 0.5px solid #e0e0d8; background: #fff; color: #1a1a18; font-size: 12px; font-weight: 500; text-decoration: none; cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap; }
.btn-drive:hover { background: #f5f5f3; border-color: #bbb; }
.drive-icon { width: 16px; height: 16px; flex-shrink: 0; }

/* tabs */
.tab-bar { background: #fff; border-bottom: 0.5px solid #e0e0d8; padding: 0 28px; display: flex; gap: 0; }
.tab-btn { padding: 12px 20px; font-size: 13px; font-weight: 500; color: #888; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; font-family: inherit; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tab-btn:hover { color: #333; }
.tab-btn.active { color: #185fa5; border-bottom-color: #185fa5; }
.tab-count { border-radius: 20px; font-size: 11px; padding: 1px 7px; }
.tab-btn.t-ativos .tab-count   { background: #dcfce7; color: #15803d; }
.tab-btn.t-ativos.active       { color: #15803d; border-bottom-color: #15803d; }
.tab-btn.t-avencer .tab-count  { background: #fffbeb; color: #92400e; }
.tab-btn.t-avencer.active      { color: #b06000; border-bottom-color: #b06000; }
.tab-btn.t-encerrados .tab-count { background: #fee2e2; color: #b91c1c; }
.tab-btn.t-encerrados.active   { color: #b91c1c; border-bottom-color: #b91c1c; }

/* layout */
.main { max-width: 1340px; margin: 0 auto; padding: 24px 28px; }
.page { display: none; }
.page.active { display: block; }

/* KPIs */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: #fff; border: 0.5px solid #e0e0d8; border-radius: 10px; padding: 16px 18px; }
.kpi-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.kpi-value { font-size: 30px; font-weight: 500; }
.kpi-sub { font-size: 11px; color: #aaa; margin-top: 4px; }
.kv-green { color: #1a7a45; } .kv-yellow { color: #b06000; } .kv-blue { color: #185fa5; } .kv-red { color: #b91c1c; }

/* section title */
.section-title { font-size: 11px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; margin-top: 24px; }

/* alert cards */
.alert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
.alert-card { border-radius: 10px; padding: 14px 16px; }
.alert-danger  { background: #fef2f2; border: 0.5px solid #fca5a5; }
.alert-warning { background: #fffbeb; border: 0.5px solid #fcd34d; }
.alert-card-title { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.alert-danger .alert-card-title  { color: #b91c1c; }
.alert-warning .alert-card-title { color: #92400e; }
.alert-item { font-size: 12px; color: #1a1a18; padding: 5px 0; border-bottom: 0.5px solid rgba(0,0,0,0.07); display: flex; align-items: center; gap: 8px; }
.alert-item:last-child { border-bottom: none; }
.alert-item-name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-item-days { font-size: 11px; color: #bbb; white-space: nowrap; }
.alert-pill { font-size: 11px; padding: 2px 10px; border-radius: 20px; border: 0.5px solid; background: #fff; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background .12s; }
.alert-pill-blue   { color: #185fa5; border-color: #93c5fd; } .alert-pill-blue:hover   { background: #e8f0fb; }
.alert-pill-red    { color: #b91c1c; border-color: #fca5a5; } .alert-pill-red:hover    { background: #fef2f2; }
.alert-empty { font-size: 12px; color: #bbb; font-style: italic; }

/* filters */
.filters { display: flex; gap: 8px; margin: 14px 0 10px; flex-wrap: wrap; align-items: center; }
.search-wrap { position: relative; }
.search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #bbb; font-size: 15px; pointer-events: none; }
.search-input { padding: 5px 12px 5px 30px; border-radius: 20px; border: 0.5px solid #ccc; background: #fff; color: #1a1a18; font-size: 12px; width: 220px; outline: none; font-family: inherit; }
.search-input:focus { border-color: #aac4f0; }
.count-label { font-size: 12px; color: #aaa; white-space: nowrap; margin-left: auto; }

/* table */
.table-wrap { border: 0.5px solid #e0e0d8; border-radius: 10px; overflow: hidden; background: #fff; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
thead { background: #fafaf8; }
th { padding: 10px 12px; text-align: left; font-weight: 500; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: #333; }
th.no-sort { cursor: default; } th.no-sort:hover { color: #888; }
td { padding: 9px 12px; border-top: 0.5px solid #f0f0ec; color: #1a1a18; vertical-align: middle; }
tr:hover td { background: #fafaf8; }
.col-nome  { width: 22%; } .col-valor { width: 14%; } .col-venc  { width: 13%; }
.col-aviso { width: 9%;  } .col-nda   { width: 7%;  } .col-multa { width: 14%; }
.col-acao  { width: 21%; }
.col-drive { width: 7%; text-align: center; }

/* badges */
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-nda-sim { background: #e8f0fb; color: #185fa5; }
.badge-nda-nao { background: #f3f3f0; color: #888; }

/* vencimento */
.venc-ok   { color: #555; }
.venc-soon { color: #b06000; font-weight: 500; }
.venc-past { color: #b91c1c; }
.venc-sub  { font-size: 10px; color: #bbb; margin-left: 2px; }
.sort-icon { font-size: 10px; margin-left: 2px; }
.empty-row td { text-align: center; color: #bbb; padding: 32px; font-style: italic; }

/* action buttons */
.btn-renovar   { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; border: 0.5px solid #93c5fd; background: #fff; color: #185fa5; font-size: 11px; cursor: pointer; font-family: inherit; transition: background .12s; white-space: nowrap; }
.btn-renovar:hover   { background: #e8f0fb; }
.btn-encerrar  { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; border: 0.5px solid #fca5a5; background: #fff; color: #b91c1c; font-size: 11px; cursor: pointer; font-family: inherit; transition: background .12s; white-space: nowrap; }
.btn-encerrar:hover  { background: #fef2f2; }
.btn-reativar  { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; border: 0.5px solid #86efac; background: #fff; color: #15803d; font-size: 11px; cursor: pointer; font-family: inherit; transition: background .12s; white-space: nowrap; }
.btn-reativar:hover  { background: #f0fdf4; }
.acao-group { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }

/* drive link in cell */
.drive-link { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 0.5px solid #e0e0d8; background: #fff; text-decoration: none; transition: background .12s; }
.drive-link:hover { background: #f5f5f3; border-color: #bbb; }

/* tags below name */
.tag-line { font-size: 10px; display: block; margin-top: 2px; }
.tag-renovado { color: #185fa5; }
.tag-encerrado { color: #b91c1c; }
.tag-obs { color: #999; }
.tag-avencer { color: #b06000; font-weight: 500; }

/* "A vencer" urgency rows */
.row-crit td { background: #fff8f8 !important; }
.row-warn td { background: #fffdf0 !important; }

/* modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 14px; padding: 28px 28px 24px; width: 440px; max-width: 94vw; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.modal h2 { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
.modal-sub strong { color: #1a1a18; }
.modal label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px; }
.modal input[type=date], .modal input[type=text], .modal textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 0.5px solid #ccc; font-size: 13px; font-family: inherit; color: #1a1a18; outline: none; }
.modal input:focus, .modal textarea:focus { border-color: #aac4f0; }
.modal textarea { resize: vertical; min-height: 64px; }
.modal-field { margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { padding: 7px 18px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #555; font-size: 13px; cursor: pointer; font-family: inherit; }
.btn-cancel:hover { background: #f5f5f3; }
.btn-ok-enc   { padding: 7px 18px; border-radius: 8px; border: none; background: #b91c1c; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; }
.btn-ok-enc:hover   { background: #991b1b; }
.btn-ok-reat  { padding: 7px 18px; border-radius: 8px; border: none; background: #15803d; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; }
.btn-ok-reat:hover  { background: #166534; }
.btn-ok-renov { padding: 7px 18px; border-radius: 8px; border: none; background: #185fa5; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; }
.btn-ok-renov:hover { background: #145088; }

/* toast */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a18; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 2000; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 960px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .alert-grid { grid-template-columns: 1fr; }
  .col-multa, .col-aviso, .col-drive { display: none; }
}
@media print { .tab-bar, .filters, .modal-overlay, .btn-renovar, .btn-encerrar, .btn-reativar, .toast { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
</body>
</html>
