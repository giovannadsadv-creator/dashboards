<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboards — Gestão de Contratos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; }

/* topbar */
.topbar { background: #fff; border-bottom: 0.5px solid #e0e0d8; padding: 14px 40px; display: flex; align-items: center; gap: 12px; }
.topbar-logo { display: flex; align-items: center; gap: 10px; }
.topbar-logo span { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.topbar-sub { font-size: 12px; color: #aaa; margin-left: auto; }

/* hero */
.hero { background: #fff; border-bottom: 0.5px solid #e0e0d8; padding: 48px 40px 40px; }
.hero-inner { max-width: 900px; margin: 0 auto; }
.hero h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 10px; }
.hero p { font-size: 15px; color: #666; line-height: 1.6; max-width: 560px; }
.hero-meta { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
.hero-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #888; background: #f5f5f3; border: 0.5px solid #e0e0d8; padding: 5px 12px; border-radius: 20px; }

/* grid */
.grid-wrap { max-width: 900px; margin: 0 auto; padding: 40px; }
.section-label { font-size: 11px; font-weight: 500; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 18px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

/* card */
.card { background: #fff; border: 0.5px solid #e0e0d8; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 0; transition: box-shadow .15s, border-color .15s; text-decoration: none; color: inherit; position: relative; overflow: hidden; }
.card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-color: #ccc; }
.card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 14px 14px 0 0; }
.accent-blue   { background: linear-gradient(90deg, #185fa5, #60a5fa); }
.accent-green  { background: linear-gradient(90deg, #15803d, #4ade80); }
.accent-purple { background: linear-gradient(90deg, #7c3aed, #c084fc); }

.card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 20px; }
.icon-blue   { background: #e8f0fb; color: #185fa5; }
.icon-green  { background: #dcfce7; color: #15803d; }
.icon-purple { background: #ede9fe; color: #7c3aed; }

.card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.card-desc  { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 20px; flex: 1; }

.card-stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-value { font-size: 20px; font-weight: 600; }
.stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-blue   { color: #185fa5; }
.stat-green  { color: #15803d; }
.stat-purple { color: #7c3aed; }
.stat-red    { color: #b91c1c; }
.stat-yellow { color: #b06000; }

.card-divider { height: 0.5px; background: #f0f0ec; margin-bottom: 16px; }

.card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
.tag-blue   { background: #e8f0fb; color: #185fa5; }
.tag-green  { background: #dcfce7; color: #15803d; }
.tag-yellow { background: #fffbeb; color: #92400e; }
.tag-red    { background: #fee2e2; color: #b91c1c; }
.tag-purple { background: #ede9fe; color: #7c3aed; }
.tag-gray   { background: #f3f3f0; color: #666; }

.btn-open { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 0; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; transition: background .12s; }
.btn-blue   { background: #185fa5; color: #fff; }
.btn-blue:hover   { background: #145088; }
.btn-green  { background: #15803d; color: #fff; }
.btn-green:hover  { background: #166534; }
.btn-purple { background: #7c3aed; color: #fff; }
.btn-purple:hover { background: #6d28d9; }

/* footer */
.footer { max-width: 900px; margin: 0 auto; padding: 0 40px 40px; }
.footer-inner { border-top: 0.5px solid #e0e0d8; padding-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.footer-text { font-size: 12px; color: #bbb; }
.footer-note { font-size: 11px; color: #ccc; display: flex; align-items: center; gap: 6px; }

@media (max-width: 760px) {
  .cards { grid-template-columns: 1fr; }
  .hero, .grid-wrap, .footer { padding-left: 20px; padding-right: 20px; }
  .topbar { padding: 12px 20px; }
}
</style>
</head>
<body>
</body>
</html>
